<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded Base Tile -->
  <rect width="64" height="64" rx="14" fill="#07090e" stroke="#1e2230" stroke-width="2"/>
  
  <!-- Subtle Radar Range Rings -->
  <circle cx="32" cy="32" r="22" stroke="#161924" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="14" stroke="#1e2230" stroke-width="1.5"/>

  <!-- Crosshair Reticle / Anycast Axes -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#1e2230" stroke-width="1.5"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="#1e2230" stroke-width="1.5"/>

  <!-- Glowing Pulse Radiance -->
  <circle cx="32" cy="32" r="9" fill="#10b981" fill-opacity="0.25"/>
  
  <!-- Incident Command Central Diamond / Shield Core -->
  <polygon points="32,18 44,32 32,46 20,32" fill="#0f1219" stroke="#10b981" stroke-width="2.5"/>
  
  <!-- Critical Core Ping -->
  <circle cx="32" cy="32" r="4" fill="#10b981"/>

  <!-- Zero-Day Alert Corner Indicator (Top-Right Warning Beacon) -->
  <circle cx="48" cy="16" r="4.5" fill="#f43f5e" stroke="#07090e" stroke-width="1.5"/>
</svg>
